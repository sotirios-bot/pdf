<footer class="site-footer">
  <div class="container footer-top">
    <div class="footer-brand">
      <span class="brand-mark">📄</span>
      <span class="brand-name">{{siteName}}</span>
      <p class="footer-tagline">{{footerTagline}}</p>
    </div>
    <div class="footer-col">
      <h4>{{footerToolsHeading}}</h4>
      {{footerToolLinks}}
    </div>
    <div class="footer-col">
      <h4>{{footerLegalHeading}}</h4>
      <a href="{{privacyHref}}">{{footerPrivacy}}</a>
      <a href="{{termsHref}}">{{footerTerms}}</a>
    </div>
  </div>
  <div class="container footer-bottom">
    <p>&copy; {{year}} {{siteName}}. Powered by <a class="powered-by" href="https://www.mytheon.co/" target="_blank" rel="noopener">Mytheon Technologies</a></p>
  </div>
</footer>
