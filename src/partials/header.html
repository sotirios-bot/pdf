<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{homeHref}}">
      <span class="brand-mark">📄</span>
      <span class="brand-name">{{siteName}}</span>
    </a>
    <nav class="main-nav">
      <a href="{{homeHref}}">{{navHome}}</a>
      <div class="nav-dropdown">
        <button type="button" class="nav-dropbtn" aria-haspopup="true">{{navConvertPdf}}<span class="caret" aria-hidden="true">▾</span></button>
        <div class="nav-menu">
          {{navToolLinks}}
        </div>
      </div>
    </nav>
    <div class="lang-switcher">
      <label for="langSelect" class="visually-hidden">{{languageLabel}}</label>
      <select id="langSelect" aria-label="{{languageLabel}}">
        {{langOptions}}
      </select>
    </div>
  </div>
</header>
