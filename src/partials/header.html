<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{homeHref}}">
      <span class="brand-mark">📄</span>
      <span class="brand-name">{{siteName}}</span>
    </a>
    <nav class="main-nav">
      <a href="{{homeHref}}">{{navHome}}</a>
      <a href="{{homeHref}}">{{navPdfToExcel}}</a>
      <a href="#">{{navAllTools}}</a>
      <a href="#">{{navPricing}}</a>

    <div class="lang-switcher">
      <label for="langSelect" class="visually-hidden">{{languageLabel}}</label>
      <select id="langSelect" aria-label="{{languageLabel}}">
        {{langOptions}}
      </select>
    </div>
  </div>
</header>
