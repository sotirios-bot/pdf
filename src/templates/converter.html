<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
{{head}}
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TJTJW398"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  {{header}}

  <main class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="{{homeHref}}">{{navHome}}</a>
      <span class="breadcrumb-sep" aria-hidden="true">›</span>
      <span aria-current="page">{{breadcrumbName}}</span>
    </nav>

    <section class="hero">
      <h1>{{h1}}</h1>
      <p class="subtitle">{{subtitle}}</p>
    </section>

    <section class="converter">
      <form id="convertForm"
            data-endpoint="{{endpoint}}"
            data-ext="{{downloadExt}}"
            data-accept-ext="{{acceptExt}}"
            data-download-event="{{downloadEvent}}"
            data-msg-converting="{{uploaderConverting}}"
            data-msg-ready="{{uploaderDownloadReady}}"
            data-msg-error="{{uploaderErrorGeneric}}"
            data-msg-filetype="{{uploaderErrorFileType}}"
            data-msg-toolarge="{{uploaderErrorTooLarge}}"
            data-msg-min="{{uploaderErrorMin}}">
        <label id="dropZone" class="drop-zone" for="fileInput">
          <span class="drop-icon">⬆️</span>
          <span class="drop-text">{{uploaderDropText}}</span>
          <span class="drop-hint">{{uploaderHint}}</span>
          <input id="fileInput" type="file" accept="{{inputAccept}}"{{fileMultiple}} hidden />
        </label>
        <p id="fileName" class="file-name" hidden></p>
        {{paramField}}
        <button id="convertBtn" type="submit" class="btn-primary" disabled>{{uploaderButton}}</button>
        <p id="statusMsg" class="status-msg" role="status" aria-live="polite"></p>
        <a id="downloadLink" class="btn-download" hidden download>{{uploaderDownload}}</a>
      </form>
      <p class="trust-note">{{trustNote}}</p>
    </section>

    <section class="how-to">
      <h2>{{howToHeading}}</h2>
      <ol class="steps-list">
        {{howToList}}
      </ol>
    </section>

    {{benefitsSection}}

    {{relatedSection}}

    {{faqSection}}
  </main>

  {{footer}}
  <script src="{{jsHref}}"></script>
</body>
</html>
